<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Layered Sprite Walk Cycle Demo</title>
    <style>
        /* Dark background, flex layout, controls styling */
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #e0e0e0; margin: 0 0 20px 0; font-size: 24px; }
        h2 { color: #c0c0c0; margin: 0 0 10px 0; font-size: 16px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .panel {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 16px;
        }
        canvas {
            border: 1px solid #333;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #1a5276;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #1a5276; }
        button.active { background: #e94560; border-color: #e94560; }
        .speed-control { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { width: 120px; }
        .frame-info {
            font-family: monospace;
            font-size: 12px;
            background: #0d1b2a;
            padding: 12px;
            border-radius: 4px;
            white-space: pre;
            line-height: 1.4;
        }
        .parts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .part-label { font-size: 11px; color: #888; text-align: center; margin-top: 4px; }
        .direction-row { display: flex; gap: 16px; align-items: flex-start; }
        .direction-item { text-align: center; }
        .direction-label { font-size: 12px; color: #aaa; margin-top: 4px; }
        .frame-strip { display: flex; gap: 4px; }
        .frame-num { font-size: 10px; color: #666; text-align: center; }
        .status { font-size: 13px; color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <h1>Layered Sprite Walk Cycle Demo</h1>

    <div class="row">
        <!-- Large animated preview -->
        <div class="panel">
            <h2>Animated Preview (6x)</h2>
            <canvas id="mainCanvas" width="192" height="192"></canvas>
            <div class="status" id="stateInfo">State: idle | Direction: down | Frame: 0</div>
        </div>

        <!-- Individual parts -->
        <div class="panel">
            <h2>Individual Parts</h2>
            <div class="parts-grid" id="partsGrid">
                <!-- 6 small canvases generated by JS -->
            </div>
        </div>
    </div>

    <!-- Frame strip -->
    <div class="panel" style="margin-bottom: 20px;">
        <h2>Walk Cycle Frames (3x)</h2>
        <div class="frame-strip" id="frameStrip">
            <!-- 6 canvases generated by JS -->
        </div>
    </div>

    <!-- All 4 directions -->
    <div class="panel" style="margin-bottom: 20px;">
        <h2>All Directions (3x)</h2>
        <div class="direction-row" id="directionRow">
            <!-- 4 direction canvases generated by JS -->
        </div>
    </div>

    <!-- Controls -->
    <div class="panel" style="margin-bottom: 20px;">
        <div class="controls">
            <button id="btnIdle" class="active">Idle</button>
            <button id="btnWalk">Walk</button>
            <span style="color:#555">|</span>
            <button id="btnPlay">Play</button>
            <button id="btnPause">Pause</button>
            <button id="btnStepBack">&lt; Step</button>
            <button id="btnStepFwd">Step &gt;</button>
            <span style="color:#555">|</span>
            <span style="font-size:13px">Direction:</span>
            <button id="btnDown" class="active">Down</button>
            <button id="btnUp">Up</button>
            <button id="btnLeft">Left</button>
            <button id="btnRight">Right</button>
            <span style="color:#555">|</span>
            <div class="speed-control">
                <span style="font-size:13px">Speed:</span>
                <input type="range" id="speedSlider" min="25" max="200" value="100">
                <span id="speedLabel" style="font-size:13px">1.0x</span>
            </div>
        </div>
    </div>

    <!-- Frame info -->
    <div class="panel">
        <h2>Frame Offsets</h2>
        <div class="frame-info" id="frameInfo">Select Walk mode to see offsets</div>
    </div>
</div>

// ============================================================================
// BODYPART SPRITE CONFIG - Z-Order, State Machine, Animation Settings
// ============================================================================

const BODYPART_SPRITE_CONFIG = {

    // Z-order per direction (rendered back -> front, last item draws on top)
    layerOrder: {
        down:  ['body', 'leftLeg', 'rightLeg', 'leftArm', 'rightArm', 'head'],
        up:    ['head', 'body', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg'],
        left:  ['rightArm', 'rightLeg', 'body', 'leftLeg', 'leftArm', 'head'],
        right: ['leftArm', 'leftLeg', 'body', 'rightLeg', 'rightArm', 'head']
    },

    // Animation state machine
    states: {
        idle:      { looping: true,  frameCount: 1 },
        walking:   { looping: true,  frameCount: 6 },
        attacking: { looping: false, frameCount: 6 },
        hit:       { looping: false, frameCount: 3 },
        dying:     { looping: false, frameCount: 6 }
    },

    // Valid state transitions: from -> [allowed targets]
    transitions: {
        idle:      ['walking', 'attacking', 'hit', 'dying'],
        walking:   ['idle', 'attacking', 'hit', 'dying'],
        attacking: ['idle', 'walking', 'hit', 'dying'],
        hit:       ['idle', 'walking', 'attacking', 'dying'],
        dying:     []  // Terminal state
    },

    // Animation speed
    walkFPS: 8,          // Base FPS for walk cycle (750ms per 6-frame loop)
    minFPS: 2,           // Minimum clamp (prevent frozen-looking animation)
    maxFPS: 16,          // Maximum clamp (prevent strobing)

    // Speed scaling: effectiveFPS = walkFPS * clamp(moveSpeed, minSpeedMult, maxSpeedMult)
    minSpeedMult: 0.25,
    maxSpeedMult: 2.0,

    // Canvas dimensions (must match sprite data)
    spriteWidth: 32,
    spriteHeight: 32,

    // Right direction derivation
    // Right is derived from left by: flipX on sprites, swap left/right parts, negate dx
    deriveRight: true,

    // Parts that get swapped when deriving right from left
    mirrorSwaps: {
        leftArm:  'rightArm',
        rightArm: 'leftArm',
        leftLeg:  'rightLeg',
        rightLeg: 'leftLeg',
        head:     'head',
        body:     'body'
    }
};

// ============================================================================
// BODYPART WALK ANIMATION - Idle + 6-Frame Walk Cycle Offset Data
// ============================================================================
// Offset-only animation: each body part shifts by (dx, dy) pixels per frame.
// No rotation. Right direction derived at runtime from left.
// ============================================================================

const BODYPART_WALK_ANIMATION = {

    // Idle state: all offsets 0,0 -- true neutral standing pose
    idle: {
        down:  { body: [0,0], head: [0,0], leftArm: [0,0], rightArm: [0,0], leftLeg: [0,0], rightLeg: [0,0] },
        up:    { body: [0,0], head: [0,0], leftArm: [0,0], rightArm: [0,0], leftLeg: [0,0], rightLeg: [0,0] },
        left:  { body: [0,0], head: [0,0], leftArm: [0,0], rightArm: [0,0], leftLeg: [0,0], rightLeg: [0,0] }
        // right: derived from left at runtime
    },

    // 6-frame walk cycle at 8 FPS (750ms loop)
    //
    // Walk Cycle Pattern:
    //   Frame 0: Right foot contact  (neutral body, legs split)
    //   Frame 1: Weight settling     (body dips dy:+1, legs planted)
    //   Frame 2: Legs passing        (head anticipates dy:-1, limbs returning center)
    //   Frame 3: Left foot contact   (neutral, arms/legs mirror of frame 0)
    //   Frame 4: Weight settling     (body dips dy:+1, legs planted)
    //   Frame 5: Legs passing        (head anticipates dy:-1, limbs returning center)

    walk: {
        // DOWN direction (front-facing, toward camera)
        // Arms: ±1 dy vertical swing (forward toward camera = +1, back = -1)
        // Legs: ±1 dy vertical stride
        down: [
            // Frame 0: Right foot contact — left arm forward(+1), right arm back(-1)
            { body: [0,0],  head: [0,0],  leftArm: [0,1],  rightArm: [0,-1],  leftLeg: [0,1],   rightLeg: [0,-1] },
            // Frame 1: Weight settling
            { body: [0,1],  head: [0,1],  leftArm: [0,1],  rightArm: [0,-1],  leftLeg: [0,1],   rightLeg: [0,0] },
            // Frame 2: Legs passing
            { body: [0,0],  head: [0,-1], leftArm: [0,0],  rightArm: [0,0],   leftLeg: [0,0],   rightLeg: [0,0] },
            // Frame 3: Left foot contact — arms swap
            { body: [0,0],  head: [0,0],  leftArm: [0,-1], rightArm: [0,1],   leftLeg: [0,-1],  rightLeg: [0,1] },
            // Frame 4: Weight settling
            { body: [0,1],  head: [0,1],  leftArm: [0,-1], rightArm: [0,1],   leftLeg: [0,0],   rightLeg: [0,1] },
            // Frame 5: Legs passing
            { body: [0,0],  head: [0,-1], leftArm: [0,0],  rightArm: [0,0],   leftLeg: [0,0],   rightLeg: [0,0] }
        ],

        // UP direction (back-facing, walking away)
        // Arms: ±1 dy vertical swing (forward away from camera = -1, back = +1)
        up: [
            // Frame 0: Right foot contact — left arm forward(-1), right arm back(+1)
            { body: [0,0],  head: [0,0],  leftArm: [0,-1], rightArm: [0,1],   leftLeg: [0,1],   rightLeg: [0,-1] },
            // Frame 1: Weight settling
            { body: [0,1],  head: [0,1],  leftArm: [0,-1], rightArm: [0,1],   leftLeg: [0,1],   rightLeg: [0,0] },
            // Frame 2: Legs passing
            { body: [0,0],  head: [0,-1], leftArm: [0,0],  rightArm: [0,0],   leftLeg: [0,0],   rightLeg: [0,0] },
            // Frame 3: Left foot contact — arms swap
            { body: [0,0],  head: [0,0],  leftArm: [0,1],  rightArm: [0,-1],  leftLeg: [0,-1],  rightLeg: [0,1] },
            // Frame 4: Weight settling
            { body: [0,1],  head: [0,1],  leftArm: [0,1],  rightArm: [0,-1],  leftLeg: [0,0],   rightLeg: [0,1] },
            // Frame 5: Legs passing
            { body: [0,0],  head: [0,-1], leftArm: [0,0],  rightArm: [0,0],   leftLeg: [0,0],   rightLeg: [0,0] }
        ],

        // LEFT direction (side-facing)
        // Arms: ±1 dx horizontal swing
        // Legs: ±1 dx stride + dy:-1 lift on stepping foot at contact
        left: [
            // Frame 0: Right foot contact — left leg forward with lift
            { body: [0,0],  head: [0,0],  leftArm: [1,0],  rightArm: [-1,0],  leftLeg: [1,-1],  rightLeg: [-1,0] },
            // Frame 1: Weight settling — foot plants
            { body: [0,1],  head: [0,1],  leftArm: [1,0],  rightArm: [-1,0],  leftLeg: [1,0],   rightLeg: [-1,0] },
            // Frame 2: Legs passing
            { body: [0,0],  head: [0,-1], leftArm: [0,0],  rightArm: [0,0],   leftLeg: [0,0],   rightLeg: [0,0] },
            // Frame 3: Left foot contact — right leg forward with lift
            { body: [0,0],  head: [0,0],  leftArm: [-1,0], rightArm: [1,0],   leftLeg: [-1,0],  rightLeg: [1,-1] },
            // Frame 4: Weight settling — foot plants
            { body: [0,1],  head: [0,1],  leftArm: [-1,0], rightArm: [1,0],   leftLeg: [-1,0],  rightLeg: [1,0] },
            // Frame 5: Legs passing
            { body: [0,0],  head: [0,-1], leftArm: [0,0],  rightArm: [0,0],   leftLeg: [0,0],   rightLeg: [0,0] }
        ]

        // right: derived at runtime from left
    }
};

// ============================================================================
// BODYPART RENDERER - Layered Sprite Compositing Engine
// ============================================================================
// Composites 6 body parts with per-frame offset animation.
// Handles z-order per direction, flipX for right, state machine.
// ============================================================================

class BodypartRenderer {
    constructor(spriteData, config, animationData) {
        this.spriteData = spriteData || (typeof BODY_PART_SPRITES !== 'undefined' ? BODY_PART_SPRITES : null);
        this.config = config || (typeof BODYPART_SPRITE_CONFIG !== 'undefined' ? BODYPART_SPRITE_CONFIG : null);
        this.animData = animationData || (typeof BODYPART_WALK_ANIMATION !== 'undefined' ? BODYPART_WALK_ANIMATION : null);

        // Animation state
        this.state = {
            current: 'idle',
            direction: 'down',
            frameIndex: 0,
            elapsed: 0,
            moveSpeed: 1.0,
            onComplete: null
        };

        // Cache for resolved right-direction frames
        this._rightFrameCache = {};
    }

    // =========================================================================
    // State Machine
    // =========================================================================

    setState(newState) {
        if (this.state.current === newState) return;
        if (this.state.current === 'dying') return; // Terminal state

        const allowed = this.config.transitions[this.state.current];
        if (allowed && !allowed.includes(newState)) return;

        this.state.current = newState;
        this.state.frameIndex = 0;
        this.state.elapsed = 0;
    }

    setDirection(direction) {
        if (this.state.direction === direction) return;
        this.state.direction = direction;
        // Snap immediately -- don't reset frame index (continue walk cycle)
    }

    reset() {
        this.state.current = 'idle';
        this.state.direction = 'down';
        this.state.frameIndex = 0;
        this.state.elapsed = 0;
        this.state.moveSpeed = 1.0;
        this.state.onComplete = null;
    }

    // =========================================================================
    // Animation Update
    // =========================================================================

    update(deltaTime) {
        const stateConfig = this.config.states[this.state.current];
        if (!stateConfig || stateConfig.frameCount <= 1) return; // idle is static

        const baseFPS = this.config.walkFPS;
        const speedMult = Math.max(this.config.minSpeedMult, Math.min(this.config.maxSpeedMult, this.state.moveSpeed));
        const effectiveFPS = Math.max(this.config.minFPS, Math.min(this.config.maxFPS, baseFPS * speedMult));
        const frameDuration = 1000 / effectiveFPS;

        this.state.elapsed += deltaTime;
        if (this.state.elapsed >= frameDuration) {
            this.state.elapsed -= frameDuration;
            this.state.frameIndex++;

            if (this.state.frameIndex >= stateConfig.frameCount) {
                if (stateConfig.looping) {
                    this.state.frameIndex = 0;
                } else {
                    this.state.frameIndex = stateConfig.frameCount - 1;
                    if (this.state.onComplete) {
                        this.state.onComplete();
                    }
                }
            }
        }
    }

    // =========================================================================
    // Drawing
    // =========================================================================

    draw(ctx, x, y, scale, directionOverride, frameOverride) {
        if (!this.spriteData || !this.config || !this.animData) return;

        const direction = directionOverride || this.state.direction;
        const frameIdx = (frameOverride !== undefined) ? frameOverride : this.state.frameIndex;
        const isRight = (direction === 'right');
        const spriteDir = isRight ? 'left' : direction;

        // Get sprite data for this direction
        const dirSprites = this.spriteData.directions[spriteDir];
        if (!dirSprites) return;

        // Get z-order for this direction
        const layerOrder = this.config.layerOrder[direction];
        if (!layerOrder) return;

        // Get offsets for current frame
        const offsets = this._getOffsets(direction, frameIdx);

        // Render each part in z-order (back to front)
        for (const partName of layerOrder) {
            // For right direction, swap part names to get the correct sprite
            const spritePart = isRight ? (this.config.mirrorSwaps[partName] || partName) : partName;
            const partSprite = dirSprites[spritePart];
            if (!partSprite) continue;

            const offset = offsets[partName] || [0, 0];
            this._renderPart(ctx, partSprite, offset, x, y, scale, isRight);
        }
    }

    _getOffsets(direction, frameIdx) {
        const stateName = this.state.current;

        // Idle: all offsets zero
        if (stateName === 'idle') {
            const idleDir = (direction === 'right') ? 'left' : direction;
            const idleOffsets = this.animData.idle[idleDir];
            if (direction === 'right' && idleOffsets) {
                return this._deriveRightOffsets(idleOffsets);
            }
            return idleOffsets || {};
        }

        // Walking: use walk cycle data
        if (stateName === 'walking') {
            const walkDir = (direction === 'right') ? 'left' : direction;
            const walkFrames = this.animData.walk[walkDir];
            if (!walkFrames) return {};

            const frame = walkFrames[frameIdx] || walkFrames[0];
            if (direction === 'right') {
                return this._deriveRightOffsets(frame);
            }
            return frame;
        }

        // Other states: return zeros for now (attack, hit, dying data not yet defined)
        return {};
    }

    _deriveRightOffsets(leftFrame) {
        // Derive right direction offsets from left:
        // 1. Swap leftArm<->rightArm and leftLeg<->rightLeg
        // 2. Negate all dx values
        const result = {};
        const swaps = this.config.mirrorSwaps;

        for (const [partName, offset] of Object.entries(leftFrame)) {
            const targetPart = swaps[partName] || partName;
            result[targetPart] = [-offset[0], offset[1]]; // negate dx, keep dy
        }

        return result;
    }

    _renderPart(ctx, partSprite, offset, x, y, scale, flipX) {
        const pixels = partSprite.pixels;
        const palette = partSprite.palette;
        const dx = offset[0];
        const dy = offset[1];

        for (let py = 0; py < pixels.length; py++) {
            const row = pixels[py];
            for (let px = 0; px < row.length; px++) {
                const char = row[px];
                if (char === '.') continue; // transparent

                const color = palette[char];
                if (!color) continue;

                // Apply offset and optional flipX
                let finalX = px + dx;
                let finalY = py + dy;

                if (flipX) {
                    finalX = 31 - (px + dx);
                }

                ctx.fillStyle = color;
                ctx.fillRect(
                    x + finalX * scale,
                    y + finalY * scale,
                    scale,
                    scale
                );
            }
        }
    }

    // =========================================================================
    // Utility
    // =========================================================================

    getState() {
        return { ...this.state };
    }

    getCurrentOffsets() {
        return this._getOffsets(this.state.direction, this.state.frameIndex);
    }

    getLayerOrder(direction) {
        return this.config.layerOrder[direction || this.state.direction] || [];
    }
}
</script>

<script>
// ========== DEMO LOGIC ==========
(function() {
    const renderer = new BodypartRenderer();
    const SCALE_MAIN = 6;
    const SCALE_PARTS = 3;
    const SCALE_STRIP = 3;
    const SCALE_DIR = 3;
    const SIZE = 32;

    // Main canvas
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d');

    // Direction renderers (for the 4-direction panel)
    const dirRenderers = {};
    const directions = ['down', 'up', 'left', 'right'];

    // Setup individual parts canvases
    const partsGrid = document.getElementById('partsGrid');
    const partNames = ['head', 'body', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg'];
    const partCanvases = {};

    partNames.forEach(name => {
        const div = document.createElement('div');
        const canvas = document.createElement('canvas');
        canvas.width = SIZE * SCALE_PARTS;
        canvas.height = SIZE * SCALE_PARTS;
        const label = document.createElement('div');
        label.className = 'part-label';
        label.textContent = name;
        div.appendChild(canvas);
        div.appendChild(label);
        partsGrid.appendChild(div);
        partCanvases[name] = canvas;
    });

    // Setup frame strip
    const frameStrip = document.getElementById('frameStrip');
    const frameCanvases = [];
    for (let i = 0; i < 6; i++) {
        const div = document.createElement('div');
        const canvas = document.createElement('canvas');
        canvas.width = SIZE * SCALE_STRIP;
        canvas.height = SIZE * SCALE_STRIP;
        const label = document.createElement('div');
        label.className = 'frame-num';
        label.textContent = 'F' + i;
        div.appendChild(canvas);
        div.appendChild(label);
        frameStrip.appendChild(div);
        frameCanvases.push(canvas);
    }

    // Setup direction previews
    const directionRow = document.getElementById('directionRow');
    const dirCanvases = {};
    directions.forEach(dir => {
        const div = document.createElement('div');
        div.className = 'direction-item';
        const canvas = document.createElement('canvas');
        canvas.width = SIZE * SCALE_DIR;
        canvas.height = SIZE * SCALE_DIR;
        const label = document.createElement('div');
        label.className = 'direction-label';
        label.textContent = dir;
        div.appendChild(canvas);
        div.appendChild(label);
        directionRow.appendChild(div);
        dirCanvases[dir] = canvas;

        // Each direction gets its own renderer instance for independent animation
        dirRenderers[dir] = new BodypartRenderer();
        dirRenderers[dir].setDirection(dir);
    });

    // State
    let playing = true;
    let lastTime = performance.now();

    // Controls
    const btnIdle = document.getElementById('btnIdle');
    const btnWalk = document.getElementById('btnWalk');
    const btnPlay = document.getElementById('btnPlay');
    const btnPause = document.getElementById('btnPause');
    const btnStepBack = document.getElementById('btnStepBack');
    const btnStepFwd = document.getElementById('btnStepFwd');
    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    const dirButtons = {
        down: document.getElementById('btnDown'),
        up: document.getElementById('btnUp'),
        left: document.getElementById('btnLeft'),
        right: document.getElementById('btnRight')
    };

    function setActiveButton(group, activeBtn) {
        group.forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    btnIdle.addEventListener('click', () => {
        renderer.setState('idle');
        setActiveButton([btnIdle, btnWalk], btnIdle);
        // Also set all direction renderers to idle
        directions.forEach(d => dirRenderers[d].setState('idle'));
    });

    btnWalk.addEventListener('click', () => {
        renderer.setState('walking');
        setActiveButton([btnIdle, btnWalk], btnWalk);
        // Also set all direction renderers to walking
        directions.forEach(d => dirRenderers[d].setState('walking'));
    });

    btnPlay.addEventListener('click', () => { playing = true; });
    btnPause.addEventListener('click', () => { playing = false; });

    btnStepFwd.addEventListener('click', () => {
        playing = false;
        renderer.state.frameIndex = (renderer.state.frameIndex + 1) % 6;
        // Sync direction renderers
        directions.forEach(d => {
            dirRenderers[d].state.frameIndex = renderer.state.frameIndex;
        });
    });

    btnStepBack.addEventListener('click', () => {
        playing = false;
        renderer.state.frameIndex = (renderer.state.frameIndex - 1 + 6) % 6;
        directions.forEach(d => {
            dirRenderers[d].state.frameIndex = renderer.state.frameIndex;
        });
    });

    Object.entries(dirButtons).forEach(([dir, btn]) => {
        btn.addEventListener('click', () => {
            renderer.setDirection(dir);
            setActiveButton(Object.values(dirButtons), btn);
        });
    });

    speedSlider.addEventListener('input', () => {
        const speed = speedSlider.value / 100;
        speedLabel.textContent = speed.toFixed(1) + 'x';
        renderer.state.moveSpeed = speed;
        directions.forEach(d => dirRenderers[d].state.moveSpeed = speed);
    });

    // Render individual parts
    function renderParts() {
        const direction = renderer.state.direction;
        const isRight = direction === 'right';
        const spriteDir = isRight ? 'left' : direction;
        const dirSprites = BODY_PART_SPRITES.directions[spriteDir];
        if (!dirSprites) return;

        const offsets = renderer.getCurrentOffsets();

        partNames.forEach(name => {
            const canvas = partCanvases[name];
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const spritePart = isRight ? (BODYPART_SPRITE_CONFIG.mirrorSwaps[name] || name) : name;
            const sprite = dirSprites[spritePart];
            if (!sprite) return;

            const offset = offsets[name] || [0, 0];
            renderer._renderPart(ctx, sprite, offset, 0, 0, SCALE_PARTS, isRight);
        });
    }

    // Render frame strip (all 6 walk frames for current direction)
    function renderFrameStrip() {
        const direction = renderer.state.direction;
        for (let i = 0; i < 6; i++) {
            const canvas = frameCanvases[i];
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Temporarily force walking state to get walk offsets
            const savedState = renderer.state.current;
            renderer.state.current = 'walking';
            renderer.draw(ctx, 0, 0, SCALE_STRIP, direction, i);
            renderer.state.current = savedState;
        }
    }

    // Update frame info
    function updateFrameInfo() {
        const info = document.getElementById('frameInfo');
        const state = renderer.getState();
        const offsets = renderer.getCurrentOffsets();

        let text = 'State: ' + state.current + ' | Direction: ' + state.direction + ' | Frame: ' + state.frameIndex + '\n';
        text += '\u2500'.repeat(50) + '\n';

        if (state.current === 'idle') {
            text += 'All offsets: [0, 0] (neutral pose)\n';
        } else {
            const parts = ['body', 'head', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg'];
            parts.forEach(part => {
                const o = offsets[part] || [0, 0];
                const dx = o[0] >= 0 ? '+' + o[0] : '' + o[0];
                const dy = o[1] >= 0 ? '+' + o[1] : '' + o[1];
                text += part.padEnd(10) + ' dx:' + dx.padStart(3) + ' dy:' + dy.padStart(3) + '\n';
            });
        }

        info.textContent = text;

        document.getElementById('stateInfo').textContent =
            'State: ' + state.current + ' | Direction: ' + state.direction + ' | Frame: ' + state.frameIndex + ' | Speed: ' + state.moveSpeed.toFixed(1) + 'x';
    }

    // Main animation loop
    function animate(now) {
        const dt = now - lastTime;
        lastTime = now;

        if (playing) {
            renderer.update(dt);
            directions.forEach(d => dirRenderers[d].update(dt));
        }

        // Draw main preview
        mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        renderer.draw(mainCtx, 0, 0, SCALE_MAIN);

        // Draw direction previews
        directions.forEach(dir => {
            const canvas = dirCanvases[dir];
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dirRenderers[dir].draw(ctx, 0, 0, SCALE_DIR);
        });

        // Draw individual parts and frame strip
        renderParts();
        renderFrameStrip();
        updateFrameInfo();

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
